        <h2 style="background: #1e293b; color: white; margin: -16px -16px 16px -16px; padding: 12px 16px; border-radius: 6px 6px 0 0; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">

            <li style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #e2e8f0;">
                <a href="{% url 'master_zip_import' %}" style="color: #16a34a; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px;">

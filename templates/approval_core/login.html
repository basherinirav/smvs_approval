{% extends 'base.html' %}
{% load static %} {% block title %}Login - SMVS Approval System{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 text-center mb-4">
            <img src="{% static 'img/logo.png' %}" height="100" class="mb-3" alt="SMVS Logo">
            <h2 class="fw-bold" style="color: var(--primary-color);">SMVS Approval System</h2>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <h4 class="text-center mb-4" style="color: var(--primary-color);">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </h4>

                    <form method="post" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                            <i class="fas fa-sign-in-alt me-1"></i> Login
                        </button>
                    </form>

                    <hr>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <p class="mb-0 small">
                            Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none">Register here</a>
                        </p>
                        <a href="{% url 'forgot_password' %}" class="text-decoration-none small">
                            Forgot Password?
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

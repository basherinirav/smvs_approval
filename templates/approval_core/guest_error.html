{% extends 'base.html' %}

{% block title %}Error - SMVS Approval{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body text-center py-5">
                    <i class="fas fa-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                    <h2 class="mt-4 text-danger">Action Failed</h2>
                    <p class="lead mt-3">{{ error }}</p>

                    <div class="mt-5">
                        <button onclick="window.close()" class="btn btn-secondary btn-lg px-5">
                            Close Window
                        </button>
                    </div>

                    <p class="text-muted mt-4 small">
                        Please contact the person who delegated this request if the problem persists.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

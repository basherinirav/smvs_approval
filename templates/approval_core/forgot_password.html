{% extends 'base.html' %}

{% block title %}Forgot Password - SMVS Approval System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <h2 class="text-center mb-4" style="color: var(--primary-color);">
                    <i class="fas fa-key"></i> Forgot Password
                </h2>
                
                <p class="text-muted text-center small mb-4">
                    Enter correct username to receive a reset link on registered email and an OTP on registered mobile number.
                </p>

                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                        <i class="fas fa-paper-plane"></i> Send Reset Link & OTP
                    </button>
                
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="text-decoration-none small">
                            <i class="fas fa-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

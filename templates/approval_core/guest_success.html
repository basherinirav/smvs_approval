{% extends 'base.html' %}

{% block title %}Action Completed - SMVS Approval{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body text-center py-5">
                    <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    <h2 class="mt-4 text-success">Thank You!</h2>
                    <p class="lead mt-3">{{ message }}</p>
                    
                    <div class="mt-4">
                        <p><strong>Form Number:</strong> {{ form_number }}</p>
                    </div>

                    <div class="mt-5">
                        <button onclick="window.close()" class="btn btn-primary btn-lg px-5">
                            Close Window
                        </button>
                    </div>

                    <p class="text-muted mt-4 small">
                        You can now safely close this tab.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Screen Locked - SMVS{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 text-center">
            <div class="card shadow-lg border-primary">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="fas fa-user-lock fa-4x text-primary"></i>
                    </div>
                    
                    <h3 class="fw-bold">Screen Locked</h3>
                    <p class="text-muted">Logged in as <strong>{{ request.user.username }}</strong></p>
                    <hr>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3 text-start">
                            <label class="form-label">Enter Password to Resume:</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Password" required autofocus>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-unlock me-2"></i> Unlock Screen
                            </button>
                            <a href="{% url 'logout' %}" class="btn btn-link text-danger small">
                                Not {{ request.user.first_name }}? Logout
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
